name: Publish Images

# Build and publish the frontend + backend images on a version tag (see CLAUDE.md, "Tags and
# releases"). X.Y.Z on main -> images X.Y.Z + latest; X.Y.Z-alpha.N / -beta.N -> that version
# only. Images go to ghcr.io under the owner of the repo the tag was pushed to.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-alpha.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+'

permissions:
  contents: read

jobs:
  check-tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      is_release: ${{ steps.check.outputs.is_release }}
      created: ${{ steps.check.outputs.created }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, to tell whether the tagged commit is on main
      - id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # The trigger globs are loose ("+" can match too much); this is the real check.
          if [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::Release tag $TAG is not on main. Plain X.Y.Z tags belong on main only; use X.Y.Z-alpha.N / -beta.N elsewhere."
              exit 1
            fi
            is_release=true
          elif [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta)\.[0-9]+$ ]]; then
            is_release=false
          else
            echo "::error::Tag $TAG is not X.Y.Z or X.Y.Z-alpha.N / -beta.N."
            exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "is_release=$is_release" >> "$GITHUB_OUTPUT"
          echo "created=$(date --utc --iso-8601=seconds)" >> "$GITHUB_OUTPUT" # one timestamp for both images
          echo "Tag $TAG -> release: $is_release"

  publish:
    name: publish (${{ matrix.name }})
    needs: check-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - name: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: desc
        env:
          NAME: ${{ matrix.name }}
        run: |
          # Image description comes from the component's own package metadata.
          case "$NAME" in
            backend)  d=$(python3 -c 'import tomllib; print(tomllib.load(open("backend/pyproject.toml", "rb"))["project"]["description"])') ;;
            frontend) d=$(jq -r '.description // empty' frontend/package.json) ;;
          esac
          if [[ -z "$d" ]]; then
            echo "::error::No description for $NAME (pyproject.toml / package.json)."
            exit 1
          fi
          echo "description=$d" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/runnx-${{ matrix.name }}
          tags: type=raw,value=${{ needs.check-tag.outputs.version }}
          flavor: latest=${{ needs.check-tag.outputs.is_release }}
          labels: |
            org.opencontainers.image.title=runnx-${{ matrix.name }}
            org.opencontainers.image.description=${{ steps.desc.outputs.description }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.documentation=${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/README.md
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=${{ github.event.repository.license.spdx_id || 'NOASSERTION' }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.check-tag.outputs.version }}
            org.opencontainers.image.created=${{ needs.check-tag.outputs.created }}
            org.opencontainers.image.vendor=Genome Research Ltd.
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
