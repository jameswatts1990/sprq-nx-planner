name: Docker Build

# Build every image to catch Dockerfile / base-image breakage. Build only, no push.
# Every PR builds; direct pushes build only when Docker-related files change.
on:
  pull_request:
  push:
    paths:
      - 'backend/Dockerfile'
      - 'backend/.dockerignore'
      - 'frontend/Dockerfile'
      - 'frontend/Dockerfile.dev'
      - 'frontend/.dockerignore'
      - 'frontend/nginx.conf'
      - 'docker-compose.yml'
      - 'docker-compose.dev.yml'
      - '.env.example'
      - '.github/workflows/docker-build.yml'

# A push to a PR branch touching Docker files fires both push and pull_request;
# cancel superseded runs on the same ref.
concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - name: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
          - name: frontend-dev
            context: ./frontend
            dockerfile: ./frontend/Dockerfile.dev
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f ${{ matrix.dockerfile }} ${{ matrix.context }}
