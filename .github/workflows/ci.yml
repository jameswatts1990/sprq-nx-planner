name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Throwaway Postgres for tests/migrations (runs every Alembic migration up and down).
    services:
      postgres:
        image: postgres:18-trixie
        env:
          POSTGRES_USER: runnx
          POSTGRES_PASSWORD: runnx
          POSTGRES_DB: runnx_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U runnx -d runnx_migrations"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MIGRATION_TEST_DATABASE_URL: postgresql+psycopg://runnx:runnx@localhost:5432/runnx_migrations
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: pip install --no-deps -e .
      # Integration tests use in-memory SQLite (see tests/integration/conftest.py);
      # tests/migrations uses the Postgres service above.
      # -v lists every test (and every parametrized case) with its outcome; -ra adds a
      # summary of non-passing cases (xfail/xpass with reasons).
      - run: pytest -v -ra

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Single source of truth for the Node version (shared with local nvm/fnm)
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test
