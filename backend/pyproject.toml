[project]
name = "runnx-backend"
version = "0.1.0"
description = "Backend API for RunNx, a scheduling LIMS for Revio SPRQ-Nx sequencing runs"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  # MLWH (Sanger's MySQL warehouse) connection probe. [rsa] pulls in cryptography, which MySQL 8's
  # default caching_sha2_password auth needs on non-TLS connections.
  "pymysql[rsa]>=1.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "httpx2>=2.12",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=77"] # 77+ for the SPDX `license` string
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
