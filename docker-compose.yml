services:
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      # port 80 is already bound by an existing nginx on this host for an unrelated
      # service - use 8080 instead rather than fight over the standard port.
      - "8080:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Optional read-only MLWH connection (see README "Configuration"); empty = MLWH off.
      MLWH_DATABASE_URL: ${MLWH_DATABASE_URL:-}
      MLWH_PASSWORD: ${MLWH_PASSWORD:-}
      MLWH_SSL_CA: ${MLWH_SSL_CA:-}
      MLWH_SSL_VERIFY: ${MLWH_SSL_VERIFY:-true}
      # Settings > Developer tools and /api/admin (raw database edits; the app has no sign-in).
      # The app defaults to off; Compose keeps them on. DEV_TOOLS_ENABLED=false in .env turns them off.
      DEV_TOOLS_ENABLED: ${DEV_TOOLS_ENABLED:-true}

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dbdata:
